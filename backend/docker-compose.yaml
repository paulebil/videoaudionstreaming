services:
  postgres:
    image: postgres:16-alpine
    container_name: videoaudionstreaming-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - videoaudionstreaming_postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

  adminer:
    image: adminer:latest
    container_name: videoaudionstreaming-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    container_name: videoaudionstreaming-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - videoaudionstreaming_redis_data:/data
    command: redis-server --appendonly yes

  redisinsight:
    image: redis/redisinsight:latest
    container_name: videoaudionstreaming-redisinsight
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "5540:5540"
    volumes:
      - videoaudionstreaming_redisinsight_data:/data

  rustfs:
    image: rustfs/rustfs:latest
    container_name: videoaudionstreaming-rustfs
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - videoaudionstreaming_rustfs_data:/data
    command: server /data --console-address ":9001"

  kafka:
    image: docker.io/apache/kafka:3.8.0
    container_name: videoaudionstreaming-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092" 
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - videoaudionstreaming_kafka_data:/var/lib/kafka/data

  connect:
    image: docker.io/debezium/connect:2.5
    container_name: videoaudionstreaming-connect
    restart: unless-stopped
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: videoaudionstreaming-connect-group
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status

  kafka-ui:
    image: docker.io/provectuslabs/kafka-ui:v0.7.2
    container_name: videoaudionstreaming-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  videoaudionstreaming_postgres_data:
  videoaudionstreaming_redis_data:
  videoaudionstreaming_redisinsight_data:
  videoaudionstreaming_rustfs_data:
  videoaudionstreaming_kafka_data: