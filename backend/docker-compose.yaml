services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: videoaudionstreaming-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - videoaudionstreaming_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: docker.io/library/adminer:latest
    container_name: videoaudionstreaming-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  rustfs:
    image: docker.io/rustfs/rustfs:latest
    container_name: videoaudionstreaming-rustfs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - videoaudionstreaming_rustfs_data:/data
    command: server /data --console-address ":9001"

volumes:
  videoaudionstreaming_postgres_data:
  videoaudionstreaming_rustfs_data: